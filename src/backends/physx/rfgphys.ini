; rfgphys settings for OpenRFG64 VOM's PhysX backend (backends\rfgphys.ini next to OpenRFG.exe). The PHYSICS row of the
; display options chooses Havok or PhysX; these are PhysX's own settings. Any key can also be set with an environment
; variable RFGPHYS_<SECTION>_<KEY>. Keys the 32-bit plugin has for the game's limits (KeepDebris, DebrisPool,
; RenderInstances, HavokHeapMB, ZoneReserve, BatchedCap, UnbatchedCap, DebrisCollide, HavokThreads...) do nothing here:
; in VOM the game sets those itself.

[General]
Enabled=1
; Each game session writes rfgphys.log and physx_host.log into a folder of its own, under this folder (empty:
; backends\rfgphys_runs); the newest KeepSessions folders are kept (0: all). RFGPHYS_RUN_DIR names the folder instead.
OutputDir=
KeepSessions=10
; A gameplay frame still running after this many seconds while a game thread is busy ends the game with a hang report
; in rfgphys.log, instead of a frozen window (0: off).
HangSeconds=30

[Telemetry]
Enabled=0

[Profiler]
Enabled=0

[Experiment]
; PhysX: debris pieces move in NVIDIA PhysX 5. 1: on the GPU (NVIDIA GTX 16 / RTX 20 series or newer; otherwise on the
; CPU), 2: on the CPU.
PhysX=1
; In the game's own process: PhysX runs on a thread of the game (backends\rfgphysx\rfgphysx_core.dll), no host process.
PhysXInProcess=1
; PhysXRate: steps per second. Each step covers a fixed time; in the heaviest moments, when a step takes longer than
; that, the debris moves in slow motion. PhysXWorld / PhysXDebris: the level's static world and the debris go there.
PhysXRate=45
PhysXWorld=1
PhysXDebris=1
; PhysXMaxBodies: the slots PhysX starts with; they grow while the GPU has room (PhysXSlotsMax, PhysXVramReserveMB).
PhysXMaxBodies=65536
; A new piece stays in the game's Havok this long before it goes to PhysX, so the pieces a blast throws still break what
; they hit (0: at once). The game's "world-only" pieces go at once.
PhysXAdoptDelayMs=2000
PhysXWorldOnlyAtOnce=1
; Pieces of PhysXSolidMassKg or more are solid to the player (you stand on rubble); lighter ones are pushed aside.
PhysXSolidDebris=1
PhysXSolidMassKg=40
; Debris at rest is drawn in piles (the resting pieces of one building as one mesh): many more FPS with a lot of debris.
PhysXDebrisPiles=1
; Loose parts of buildings move in PhysX too: they land on the rubble and on each other and break as they hit.
PhysXChunks=1
PhysXChunkBreakKN=50
PhysXChunkCrushJPerKg=250
PhysXChunkCrackPercent=3
PhysXChunkMaterials=1
PhysXChunkStumpPercent=100
PhysXChunkSnapMrad=20
PhysXChunkRestStrength=6
PhysXChunkCrushAtContact=1

[FlyCamera]
Enabled=0

[Harness]
Mode=off
