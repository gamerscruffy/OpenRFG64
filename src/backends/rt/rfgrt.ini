; rfgrt settings (release). Any key can also be set with an environment variable RFGRT_<SECTION>_<KEY>.

[General]
; 0 turns the mod off: the game runs as it ships.
Enabled=1
; Each game session writes rfgrt.log and rfgrt_host.log into a folder of its own, under this folder (empty:
; scripts\rfgrt_runs next to this file). Only the newest KeepSessions folders are kept (0: all).
OutputDir=
KeepSessions=10

[Host]
; The ray tracing process (scripts\rfgrt\rfgrt_host.exe, 64-bit, Direct3D 12). 0: off, the game as it ships.
Enabled=1
; 3: path tracing (the sun's shadows, and with the sections below global illumination, reflections and the lights'
; shadows).
Mode=3
; The memory the game's meshes pass through on their way to the ray tracing process, in MB.
RingMB=32
; The most a frame waits for the ray tracing process, in milliseconds. Where the path tracing takes most of the
; graphics card's time (big scenes, lots of debris), every frame waits for its own result: the game runs at the path
; tracer's pace. A frame it gives up on shows the previous frame's lighting under the new picture (it lags behind the
; view as it moves). 0: never wait.
WaitMs=50
; If the graphics card drops the ray tracing (a lost device: a hang the driver reset, or a bad memory access), the log
; tells which command it was running and which memory it touched (Direct3D 12's removed-device data; costs a little
; GPU time). The game then goes on with its own lighting either way. 0: off.
Dred=1

[Render]
; 1: the game's shadow maps draw nothing while the ray-traced shadows replace them (its cloud shadows stay). 0: the
; game draws them anyway (costs render time, changes nothing on screen).
SkipCascades=1
; Development views over the frame: 1 the game's shadows (left half) against the ray-traced ones (right half),
; 2 the ray-traced ambient occlusion. 0: off.
DebugView=0

[Mirror]
; Every mesh and every object the game draws are mirrored in the ray tracing process.
Enabled=1
MaxInstances=65536
; Animated characters cast shadows in their current pose (0: in their resting pose, which costs less).
Skinning=1
; Light goes through glass and other see-through materials (0: they block it like walls).
Glass=1
; The terrain is traced piece by piece, only where the game draws it (0: each terrain tile whole, which casts dark
; bands on slopes where neighbouring tiles overlap).
TerrainChunks=1

[Shadows]
; Rays a pixel each frame toward the sun, spread over its disk; the frames accumulate them.
Rays=2
; The sun's angular radius in degrees: larger makes shadow edges softer.
SunAngle=0.5
; The smoothing filter's radius in pixels (0: none).
FilterRadius=2
; The most frames the shadows are averaged over (1: none, noisier).
History=12
; The sun's highlight a surface keeps in full shadow: 0 none; the game's own materials keep 0.05, which shows as
; sun glints inside buildings and vehicles once their shade is path-traced.
Specular=0

[GI]
; Global illumination: the light bounced off everything around a surface, path-traced, in place of the game's flat
; ambient colour (its materials, glows and self-illumination stay theirs).
Enabled=1
; Rays a pixel each frame, and how far they go (metres).
Rays=2
Length=500
; The bounced light's strength: 1 is as traced.
Bounce=1.0
; The least albedo sunlit surfaces bounce the sun with. The game's textures are authored dark under a very bright sun (its
; ground sends on about 0.03 of the sun it gets, real ground 0.15 to 0.3), so the shade beside sunlit ground (under an
; overhang, a wall facing it) got little of its bounce: the sun's light off a darker surface is scaled as if it were this
; bright (at most 32 times). 0: the bounce as the game draws the surfaces; 0.1 to 0.3: more of it (0.2: walls in shade
; about as bright as the game's own fill where its sun is low, brighter than that under a strong sun).
SunBounceAlbedo=0.3
; The same for surfaces in shade: the light they get (the sky's, the lights', the bounces') goes on as if they were no
; darker than this, so the second and later bounces carry on (an overhang's ceiling onto its floor, the light through a
; room). At most 0.5 (those bounces feed back). 0: as the game draws them. Equal to SunBounceAlbedo, the rays skip asking
; whether the sun reaches what they hit (cheaper).
ShadeBounceAlbedo=0.3
; The particles that give light (the screens, whose pictures are particles; [graphics] screen_lights=1 in the game's
; config.ini gives them the game's lights instead) light what is around them with what they show: their light times what
; the game draws them with (1 as drawn, 0 none).
ScreenLight=1
; The sky as a light source, reaching what it can see of it: 1 the game's sky colour, 0 none (the sun, the lights and
; glowing surfaces alone, bounced around).
Sky=1
; Light of surfaces seen before keeps bouncing when they are out of view (a cache of it in the world).
Cache=1
; The surfaces' own textures for what the rays hit out of view (reflections in windows, bounced light's colour); 0: a
; plain grey for all of them.
Textures=1
; The colour the rays give the terrain where they meet it out of view (red, green, blue, linear: by default the dark
; rust the game gives its soil).
TerrainAlbedo=0.032,0.010,0.002
; Windows and glass shards lit by the path tracer (their shadow, the light around them) instead of their own
; flat lighting.
Glass=1
; The patterned (frosted) glass of the multiplayer maps scatters the light through it: no sunlight passes straight
; through, its panes glow on the other side instead. 0: a share of the sunlight passes straight through each pane.
FrostedGlass=1
; Sunlight through windows takes the colour of the glass where it passes it (stained or tinted glass,
; dirt): 0 keeps it white.
WindowTint=1
; Cloud shadows: 1 the clouds' shadows darken the sunlight the path tracer bounces, the fog and the windows, as the
; game's darken the direct sunlight; 0 only the direct sunlight.
CloudShadows=1
; The rim light the game gives some characters' clothes (a glow along their edges turned away from the sun, so that
; they stand out against its flat lighting): 0 none, the path tracer's light from behind them alone (with the game's
; they seemed to glow from behind), 1 the game's, or anything between.
RimLight=0
; OpenRFG64: lamps, screens and signs (the game's light-source materials) light what is around them: the light they
; give off, times their texture (4: as bright as a fully self-lit material; 0 off). Small bright ones are noisy.
Emissive=6
; The same for the glow halos drawn over lights (the game's glow materials), the light a ray crossing one gathers. 0 by
; default: a halo is a picture turned toward the camera, so it lit what was between it and you (the player, props near
; you) and not the walls beside it (a flashing red beacon over a building lit Mason red).
Glow=0
; OpenRFG64: materials at least this self-illuminated (screens, signs, lit panels in the game's ordinary shaders) give
; off light too, Emissive times their self-illumination. 0: only the light-source materials.
SelfLit=0.5
; OpenRFG64: screens that give off light, told by their picture's texture name (pieces of names, comma-separated, any
; case): their materials are the buildings' ordinary ones. The Insert probe's texture id is in the run folder's
; texture_shaders.txt with its name, to add one. Empty: none.
Screens=screen,monitor,display,metal_wksgj001,metal_wkjhy001
; OpenRFG64: glowing things light what is around them, each ray aimed at one of them (steady, few specks): glowing
; particles (sparks, fire, the jetpack's flame, muzzle flashes; not smoke, dust or the always-on-top ones), coronas
; (the glow over street lights, beacons) and lamp and screen meshes; the brightest 64 near you. 0: none.
Emitters=1
; Their light's strength (1 as made), and the lamp and screen meshes' on top of it.
EmitterLight=1
EmitterMesh=1
; OpenRFG64: how much of their own colour the lights from glowing things keep: 1 all of it, 0 white light (at the same
; brightness). At 1 a blue screen or a blue lamp turned the whole room blue.
EmitterSaturation=0.5
; OpenRFG64: the smallest size (m) a light from a glowing thing counts as: a spark beside a wall no longer blows it out.
EmitterMinRadius=0.3
; OpenRFG64: the brightest a single ray's light may be (luminance; 0: no limit). Lower: less flicker and fewer bright
; specks around small lights and screens, but they light less.
Clamp=16
; The bounced light's denoiser: 2 NVIDIA DLSS Ray Reconstruction (RTX graphics cards; elsewhere the next), 1 our
; edge-preserving filter over a wide area, 0 a single small pass.
Denoiser=2
; What light from the sky looks like: 1 the colour of the sky the game draws (red to orange by day) at the brightness the
; game gives its shade, 2 the drawn sky as it is (truer, about four times darker), 0 the game's own ambient colour
; (bluish), or anything between.
SkyDrawn=1
; The most frames averaged, and the smoothing filter's radius in pixels.
History=24
FilterRadius=3

[DLSS]
; With Denoiser=2 (DLSS Ray Reconstruction): how much of the picture the bounced light is traced at, Ray Reconstruction
; filling in the rest. 1 DLAA (all of it), 2 quality, 3 balanced, 4 performance (a quarter of the rays), 5 ultra
; performance (a ninth): faster, softer light. 0 turns DLSS off (our own filter instead). In OpenRFG64 VOM the DLSS row
; of the display options sets it instead.
Mode=1

[FrameGeneration]
; DLSS Frame Generation (an NVIDIA GeForce RTX 40 or 50 series card): one generated frame between each two, about twice
; the frames shown, with either renderer. The game's frames are then presented through a Direct3D 12 swap chain of the
; path tracer's (windowed or borderless; exclusive full screen keeps the game's own). RivaTuner's on-screen display slows
; it down a lot: set its detection level to None for the game. In OpenRFG64 VOM the FRAME GENERATION row of the display
; options sets it instead.
Enabled=0

[Fog]
; Volumetric fog (needs GI): the game's fog, in its colour and density, lit by what reaches it: light shafts where the
; sun breaks through, darker fog in shadows and indoors. 0: the game's own fog.
Enabled=1
; The share of the fog's light that comes from the sun (the rest from the sky): higher makes shadowed fog darker and
; the shafts stronger. Fog that both the sun and the sky reach looks as the game's whatever this is.
SunShare=0.65
; How much more the sun's share counts looking toward the sun than away from it (0 the same, up to 0.9): the shafts
; stand out more toward the sun.
Anisotropy=0.25
; The fog near you. The game leaves its fog out near the camera (the first 15 to 30 m of its daytime fog); this keeps
; that share of it there: 0 the game's (none, the light shafts start further out), 1 the fog from the camera on (as
; dense near you as further out; everything a little foggier).
Near=0.5
; The fog's noise. Each patch of fog averages its rays over up to this many frames: more is smoother but follows moving
; shadows more slowly.
History=20
; Rays from each patch of fog a frame, 1 to 4: more is a little smoother and costs more GPU time (with Filter=1 the
; extra rays made no visible difference).
Rays=1
; 1: each patch of fog averaged with its neighbours across the screen (smoother, the shafts' edges a little softer);
; 0: not.
Filter=1
; Fog and walls: 1 each patch of fog lit only by the air on your side of the walls and the ground (a patch reaching
; through a wall no longer brings the lit fog outside into a dark room); 0 as before.
Walls=1
; The glass (windows): 1 fogged as everything around it, at its own distance; 0 the game's own fog on it (none near you,
; as bright in the shade as in the sun, tinted by the glass's colour).
Glass=1

[Tonemap]
; The game's tone mapping while path tracing (the game's own renderer keeps its look).
; The bloom's strength: 1 the game's, 0 none. At 1 its glow around bright parts made a lit hole or window look like a
; lamp; OpenRFG64 keeps some of it, for the lights' and the screens' glow.
Bloom=0.1
; How far the eye adapts to a scene darker than its time of day's base: 1 all the way, as eyes do; 0.5 about the game's
; own; below 0 the game's exactly. A path-traced room is 10 to 30 times darker than the game's flat fill lit it, and the
; game's eye opened only 1.7 times there (all the way: 3). Brighter scenes keep the game's adaptation.
EyeAdaptationDark=1
; OpenRFG64: a filmic tone curve blended over the game's (only while path tracing): 0 the game's curve alone, 1 all
; filmic. It deepens shadows, lifts mid-tones a little and keeps white where it was; dark mid-tones keep their brightness.
Filmic=0.5
; What the filmic curve is fed, times: above 1 brighter, below 1 darker (1 matches the game's dark mid-tones).
FilmicExposure=1

[Particles]
; While path tracing, the particles the game draws over everything (always on top: the camera's wind dust) are drawn
; with the sky instead, behind every world object: they blew through walls and roofs, bright in dark interiors. 0: the
; game's.
AlwaysOnTopWithSky=1
; The effects (the start of their names, comma separated) whose particles are drawn with the sky too: the camera's wind
; dust's other emitters (6 of its 11 are not always on top: drawn where they float, inside rooms too) and the wind's
; gusts and dust devils, which the game plays ahead of the player, indoors too, and which drift through walls. Empty:
; none.
WithSkyEffects=env_gust,env_dust_camera

[Reflections]
; Path-traced reflections in place of the materials' reflection of a flat sky (needs GI).
Enabled=1
; How far the rays go (metres), and how sharp the reflections are (higher: sharper).
Length=500
Gloss=32
; Frames averaged (each held to what is around it this frame, so moving things do not leave trails).
History=12
FilterRadius=1
; Windows and other clear glass reflect like a mirror, as much as their angle makes them (more at grazing angles;
; GlassReflectance: how much straight on: 0.04 is plain glass, 0.2 coated glass, 1 a mirror).
Glass=1
GlassReflectance=0.08
; How much of the glass's own lit colour covers what is behind it, times the game's (1: the game's; less: clearer,
; less milky glass). Read when the game starts.
GlassOpacity=0.8

[Lights]
; Shadows for the game's dynamic lights (explosions, fires, lamps): each of the nearest gets a ray-traced shadow.
Enabled=1
Max=16

[AO]
; Ray-traced ambient occlusion in place of the game's screen-space one (with GI on, the GI holds the occlusion: this
; only applies with GI off, or with WithGI=1).
Enabled=1
; Rays a pixel each frame, and how far (metres) a surface still occludes.
Rays=2
Radius=2.0
WithGI=0

[Telemetry]
; Development logs: every mesh the game creates, and the shaders it loads. (The environment variable
; RFGRT_TELEMETRY_GICENSUS=1, read by the core: the traced light by the kind of surface, in its log.)
GeometryCensus=0
DumpShaders=0

[Test]
; Press this key (a Windows virtual-key code, in decimal: 45 is Insert; F10 is the game's free camera) with the
; crosshair on something, and the session log (rfgrt_runs\...\rfgrt.log) names what the rays meet there: what shadows
; that spot, its material (an emitter or not), and whether the ray tracing sees what the game drew. 0 turns it off.
ProbeKey=45
; This key (122 is F11) switches between the path tracing and the game's own lighting and shadows, on the spot, for
; comparing. 0 turns it off.
VanillaKey=122
